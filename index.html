<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="sub">Sign up to get started.</p>

    <form id="signup" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <small class="error" data-for="name"></small>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <small class="error" data-for="email"></small>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <small class="error" data-for="password"></small>

      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <small class="error" data-for="confirm"></small>

      <label class="check">
        <input id="terms" name="terms" type="checkbox" required>
        I agree to the terms and conditions
      </label>
      <small class="error" data-for="terms"></small>

      <button type="submit">Sign up</button>
    </form>

    <p id="success" class="success" hidden>Account created. Welcome!</p>
    <p class="foot">Already have an account? <a href="#">Log in</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
